<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test Map 2</title>
<style>body{margin:0} #map{width:100vw;height:100vh}</style>
</head>
<body>
<div id="map"></div>
<script type="module">
import maplibregl from '/node_modules/.vite/deps/maplibre-gl.js?v=20121cb8';
import '/node_modules/maplibre-gl/dist/maplibre-gl.css';
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [77.0266, 28.4595],
  zoom: 12
});
map.on('error', e => console.error('MAP ERROR', e.error && e.error.message));
map.on('load', () => console.log('MAP LOAD'));
</script>
</body>
</html>
